<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug TrvicERP</title>
</head>
<body>
    <div id="root">
        <h1>TrvicERP Debug Page</h1>
        <p>正在檢查環境變數...</p>
        <div id="env-check"></div>
        <div id="error-log"></div>
    </div>

    <script>
        // 檢查環境變數
        const envCheck = document.getElementById('env-check');
        const errorLog = document.getElementById('error-log');
        
        console.log('開始檢查環境變數...');
        
        // 檢查 Vite 環境變數
        const supabaseUrl = import.meta.env?.VITE_SUPABASE_URL;
        const supabaseKey = import.meta.env?.VITE_SUPABASE_ANON_KEY;
        
        if (supabaseUrl) {
            envCheck.innerHTML += `<p style="color: green;">✅ VITE_SUPABASE_URL: ${supabaseUrl}</p>`;
        } else {
            envCheck.innerHTML += `<p style="color: red;">❌ VITE_SUPABASE_URL 未設定</p>`;
        }
        
        if (supabaseKey) {
            envCheck.innerHTML += `<p style="color: green;">✅ VITE_SUPABASE_ANON_KEY: 已設定 (${supabaseKey.substring(0, 20)}...)</p>`;
        } else {
            envCheck.innerHTML += `<p style="color: red;">❌ VITE_SUPABASE_ANON_KEY 未設定</p>`;
        }
        
        // 檢查其他環境變數
        envCheck.innerHTML += `<p>所有環境變數: ${JSON.stringify(import.meta.env, null, 2)}</p>`;
        
        // 監聽錯誤
        window.addEventListener('error', (event) => {
            console.error('捕獲到錯誤:', event.error);
            errorLog.innerHTML += `<p style="color: red;">錯誤: ${event.error?.message || event.message}</p>`;
        });
        
        // 監聽未處理的 Promise 拒絕
        window.addEventListener('unhandledrejection', (event) => {
            console.error('未處理的 Promise 拒絕:', event.reason);
            errorLog.innerHTML += `<p style="color: red;">Promise 錯誤: ${event.reason?.message || event.reason}</p>`;
        });
    </script>
</body>
</html>

version: 1.0.0
title: "多角色 UI 元件驗證"
description: "透過軟體架構師、LLM 訓練師、UI/UX 設計師、品牌顧問四種專家視角驗證元件"
author:
  name: "TravelMaster 開發團隊"

prompt: |
  對 {{target_directory}} 目錄下的所有元件執行完整的多角色驗證。
  依序執行四種驗證視角，並產出整合報告。

instructions: |
  你正在協調多角色驗證流程。這是一個全面的品質審查，從四個不同的專業角度評估 TravelMaster UI 元件。
  
  ## 執行流程
  
  1. 首先列出目標目錄中的所有元件檔案
  2. 對每個元件依序執行四個角色的審查
  3. 收集所有發現並產出整合報告
  
  ---
  
  ## 角色 1：軟體架構師審查 👷
  
  以 15 年經驗的資深軟體架構師視角審查程式碼結構。
  
  ### 審查重點
  1. **單一職責原則**: 每個元件是否只做一件事
  2. **Props 介面設計**: TypeScript 型別是否嚴謹
  3. **元件組合模式**: 是否正確使用 composition over inheritance
  4. **效能考量**: 
     - 是否有不必要的重新渲染
     - useMemo/useCallback 使用是否適當
     - 大型列表是否需要虛擬化
  5. **依賴管理**: 是否有循環依賴、是否 tree-shaking 友善
  
  ### 輸出格式
  ```
  [架構] 元件名稱: 問題描述 | 嚴重度: 高/中/低 | 可自動修復: 是/否
  ```
  
  ---
  
  ## 角色 2：LLM 訓練師視角 🤖
  
  評估程式碼對 AI 輔助開發的友善程度。
  
  ### 審查重點
  1. **命名品質**: 函式和變數名稱是否清晰、具描述性
  2. **文件完整性**: JSDoc 註解是否存在且準確
  3. **模式一致性**: 跨元件的編碼風格是否統一
  4. **測試覆蓋**: 是否有對應的測試檔案
  5. **可讀性**: AI 是否能輕易理解程式碼意圖
  
  ### 輸出格式
  ```
  [訓練] 元件名稱: 問題描述 | 建議: 具體改進方式
  ```
  
  ---
  
  ## 角色 3：UI/UX 設計師稽核 🎨
  
  驗證元件是否符合 TravelMaster 設計系統規範。
  
  ### 設計代碼參考
  
  **色彩系統**
  | Token | 色碼 | 用途 |
  |-------|------|------|
  | primary-900 | #1E3A8A | Navigator Blue - 主色調、導航 |
  | success | #10B981 | Forest Green - 成功狀態、CTA |
  | error | #EF4444 | 錯誤狀態 |
  | warning | #F59E0B | 警告狀態 |
  | info | #3B82F6 | 資訊提示 |
  
  **字體規範**
  - UI 元素: Inter (400, 500, 600, 700)
  - 繁體中文: Noto Sans TC
  - 最小字級: 14px（永不低於）
  - 行高: 1.5× 字級
  
  **間距網格**
  - 基礎單位: 4px
  - 允許值: 4, 8, 12, 16, 24, 32, 48, 64
  
  **互動狀態**
  - 每個可互動元素必須有: hover, focus, active, disabled 狀態
  
  ### 審查重點
  1. 色彩是否使用 token（非硬編碼）
  2. 字體是否符合規範
  3. 間距是否在網格上
  4. 互動狀態是否完整
  5. 響應式斷點是否一致
  
  ### 輸出格式
  ```
  [設計] 元件名稱: 違規描述 | Token: 預期值 → 實際值 | 可自動修復: 是/否
  ```
  
  ---
  
  ## 角色 4：品牌顧問檢查 💼
  
  從品牌一致性角度評估元件。
  
  ### TravelMaster 品牌指南
  - **核心理念**: 沉浸式智慧 (Immersive Intelligence)
  - **視覺語言**: 結合台灣自然景觀的呼吸感與分析精準度
  - **色彩語義**:
    - 藍色 = 導航、信任、專業
    - 綠色 = 成功、行動、確認
    - 紅色 = 錯誤、警告、危險
  
  ### 審查重點
  1. 色彩使用是否符合語義（例如：成功訊息不應用藍色）
  2. 跨元件變體的視覺語言是否一致
  3. 圖標風格是否統一
  4. 動效是否符合品牌調性（專業但不呆板）
  
  ### 輸出格式
  ```
  [品牌] 元件名稱: 關注描述 | 品牌影響: 說明
  ```
  
  ---
  
  ## 整合報告
  
  完成所有角色審查後，產生 `CONSOLIDATED_REPORT.md` 包含：
  
  ### 1. 執行摘要
  ```markdown
  ## 執行摘要
  
  - 審查元件數: X
  - 發現問題總數: X
    - 高嚴重度: X
    - 中嚴重度: X
    - 低嚴重度: X
  - 可自動修復: X
  - 需人工處理: X
  ```
  
  ### 2. 優先修復清單
  按嚴重度排序的問題清單，標記 [自動修復] 或 [人工處理]
  
  ### 3. 各角色詳細發現
  分類整理每個角色的所有發現
  
  ### 4. 改進建議
  整體性的架構或設計改進建議

parameters:
  - key: target_directory
    input_type: string
    requirement: required
    default: "./src/components"
    description: "要驗證的元件目錄路徑"

extensions:
  - type: builtin
    name: developer

settings:
  goose_model: "deepseek-ai/DeepSeek-V3"
  temperature: 0.0
  goose_max_turns: 50

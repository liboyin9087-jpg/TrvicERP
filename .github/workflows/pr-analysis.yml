name: TrvicERP Analysis on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run TrvicERP Analysis - Software Engineer
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -n "$SILICONFLOW_API_KEY" ]; then
            echo "🔧 Running Software Engineer Agent..."
            python trvic_analyzer_v2.py . --agents software_engineer --rpm 8 --delay 8
          else
            echo "⚠️ SILICONFLOW_API_KEY not set, skipping analysis"
          fi
        continue-on-error: true
      
      - name: Run TrvicERP Analysis - AI Solution
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -n "$SILICONFLOW_API_KEY" ]; then
            echo "🤖 Running AI Solution Agent..."
            python trvic_analyzer_v2.py . --agents ai_solution --rpm 8 --delay 8
          else
            echo "⚠️ SILICONFLOW_API_KEY not set, skipping analysis"
          fi
        continue-on-error: true
      
      - name: Run TrvicERP Analysis - Business Development
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -n "$SILICONFLOW_API_KEY" ]; then
            echo "💼 Running Business Development Agent..."
            python trvic_analyzer_v2.py . --agents business_development --rpm 8 --delay 8
          else
            echo "⚠️ SILICONFLOW_API_KEY not set, skipping analysis"
          fi
        continue-on-error: true
      
      - name: Run TrvicERP Analysis - Brand Strategy
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -n "$SILICONFLOW_API_KEY" ]; then
            echo "🎨 Running Brand Strategy Agent..."
            python trvic_analyzer_v2.py . --agents brand_strategy --rpm 8 --delay 8
          else
            echo "⚠️ SILICONFLOW_API_KEY not set, skipping analysis"
          fi
        continue-on-error: true
      
      - name: Run TrvicERP Analysis - UI/UX
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -n "$SILICONFLOW_API_KEY" ]; then
            echo "🖥️ Running UI/UX Agent..."
            python trvic_analyzer_v2.py . --agents ui_ux --rpm 8 --delay 8
          else
            echo "⚠️ SILICONFLOW_API_KEY not set, skipping analysis"
          fi
        continue-on-error: true
      
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports
          path: analysis_reports/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Comment PR with Analysis Summary
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🔬 TrvicERP Analysis Report\n\n';
            
            try {
              const reportsDir = 'analysis_reports';
              if (fs.existsSync(reportsDir)) {
                const files = fs.readdirSync(reportsDir);
                
                if (files.length > 0) {
                  comment += '✅ Analysis completed successfully!\n\n';
                  comment += `📊 **${files.length} report(s) generated**\n\n`;
                  comment += 'Download the detailed reports from the workflow artifacts.\n';
                } else {
                  comment += '⚠️ No analysis reports were generated.\n';
                  comment += 'Please check if SILICONFLOW_API_KEY is configured in repository secrets.\n';
                }
              } else {
                comment += '⚠️ Analysis reports directory not found.\n';
                comment += 'Please check if SILICONFLOW_API_KEY is configured in repository secrets.\n';
              }
            } catch (error) {
              comment += '❌ Error reading analysis reports: ' + error.message + '\n';
            }
            
            comment += '\n---\n';
            comment += '*Analysis performed by TrvicERP Multi-Expert Analyzer v2.0*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

name: PR Audit (All Agents)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rpm:
        description: "Requests per minute"
        required: false
        default: "10"
      delay:
        description: "Delay between requests (seconds)"
        required: false
        default: "10"

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Download analyzer
        run: |
          curl -L "https://raw.githubusercontent.com/${{ github.repository }}/main/files.zip" -o files.zip
          unzip -q files.zip -d files_zip

      - name: Run full audit
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          RPM: ${{ inputs.rpm }}
          DELAY: ${{ inputs.delay }}
        run: |
          if [ -z "${SILICONFLOW_API_KEY}" ]; then
            echo "Missing SILICONFLOW_API_KEY secret."
            exit 1
          fi
          RPM="${RPM:-10}"
          DELAY="${DELAY:-10}"
          python3 files_zip/trvic_analyzer_v2.py . \
            --agents software_engineer ai_solution business_development brand_strategy ui_ux \
            --no-resume \
            --rpm "${RPM}" \
            --delay "${DELAY}"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pr-audit-report
          path: |
            analysis_reports/*.md
            .trvic_sessions/*.json

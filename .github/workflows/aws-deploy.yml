# ============================================
# TrvicERP - GitHub Actions AWS Deployment
# ============================================

name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      # Build all three images in parallel
      - name: Build Frontend image
        run: |
          docker build -t trvicerp-frontend \
            -f Dockerfile.frontend \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_AI_API_URL=/ai \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            .
          docker tag trvicerp-frontend $ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG
          docker tag trvicerp-frontend $ECR_REGISTRY/trvicerp-frontend:$ENVIRONMENT

      - name: Build Backend image
        run: |
          docker build -t trvicerp-backend -f backend/Dockerfile ./backend
          docker tag trvicerp-backend $ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG
          docker tag trvicerp-backend $ECR_REGISTRY/trvicerp-backend:$ENVIRONMENT

      - name: Build AI Server image
        run: |
          docker build -t trvicerp-ai-server -f ai-server/Dockerfile ./ai-server
          docker tag trvicerp-ai-server $ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG
          docker tag trvicerp-ai-server $ECR_REGISTRY/trvicerp-ai-server:$ENVIRONMENT

      - name: Push images to ECR
        run: |
          docker push $ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/trvicerp-frontend:$ENVIRONMENT
          docker push $ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/trvicerp-backend:$ENVIRONMENT
          docker push $ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG
          docker push $ECR_REGISTRY/trvicerp-ai-server:$ENVIRONMENT

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file aws/cloudformation.yml \
            --stack-name trvicerp-$ENVIRONMENT \
            --parameter-overrides \
              Environment=$ENVIRONMENT \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              JWTSecretKey=${{ secrets.JWT_SECRET_KEY }} \
              GeminiApiKey=${{ secrets.GEMINI_API_KEY }} \
              SupabaseUrl=${{ secrets.VITE_SUPABASE_URL }} \
              SupabaseAnonKey=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
              FrontendImage=$ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG \
              BackendImage=$ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG \
              AIServerImage=$ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Update ECS Services
        run: |
          CLUSTER="trvicerp-${ENVIRONMENT}"
          for service in frontend backend ai-server; do
            aws ecs update-service \
              --cluster $CLUSTER \
              --service "trvicerp-${ENVIRONMENT}-${service}" \
              --force-new-deployment \
              --region $AWS_REGION || true
          done

      - name: Get deployment URL
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name trvicerp-$ENVIRONMENT \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** http://$ALB_DNS" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** $IMAGE_TAG" >> $GITHUB_STEP_SUMMARY

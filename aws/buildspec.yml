# ============================================
# TrvicERP - AWS CodeBuild Spec
# ============================================
# For AWS CodePipeline CI/CD integration
# ============================================

version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-northeast-1
    ENVIRONMENT: production
  parameter-store:
    DB_PASSWORD: /trvicerp/db-password
    JWT_SECRET: /trvicerp/jwt-secret
    GEMINI_API_KEY: /trvicerp/gemini-api-key
    VITE_SUPABASE_URL: /trvicerp/supabase-url
    VITE_SUPABASE_ANON_KEY: /trvicerp/supabase-anon-key

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building Docker images..."

      # Frontend
      - docker build -t trvicerp-frontend -f Dockerfile.frontend --build-arg VITE_API_URL=/api --build-arg VITE_AI_API_URL=/ai --build-arg VITE_SUPABASE_URL=$VITE_SUPABASE_URL --build-arg VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY .
      - docker tag trvicerp-frontend $ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG
      - docker tag trvicerp-frontend $ECR_REGISTRY/trvicerp-frontend:$ENVIRONMENT

      # Backend
      - docker build -t trvicerp-backend -f backend/Dockerfile ./backend
      - docker tag trvicerp-backend $ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG
      - docker tag trvicerp-backend $ECR_REGISTRY/trvicerp-backend:$ENVIRONMENT

      # AI Server
      - docker build -t trvicerp-ai-server -f ai-server/Dockerfile ./ai-server
      - docker tag trvicerp-ai-server $ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG
      - docker tag trvicerp-ai-server $ECR_REGISTRY/trvicerp-ai-server:$ENVIRONMENT

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."
      - docker push $ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG
      - docker push $ECR_REGISTRY/trvicerp-frontend:$ENVIRONMENT
      - docker push $ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG
      - docker push $ECR_REGISTRY/trvicerp-backend:$ENVIRONMENT
      - docker push $ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG
      - docker push $ECR_REGISTRY/trvicerp-ai-server:$ENVIRONMENT

      # Generate imagedefinitions for ECS deploy
      - printf '[{"name":"frontend","imageUri":"%s"},{"name":"backend","imageUri":"%s"},{"name":"ai-server","imageUri":"%s"}]' $ECR_REGISTRY/trvicerp-frontend:$IMAGE_TAG $ECR_REGISTRY/trvicerp-backend:$IMAGE_TAG $ECR_REGISTRY/trvicerp-ai-server:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - aws/cloudformation.yml

cache:
  paths:
    - /root/.npm/**/*
    - /root/.cache/pip/**/*

# ============================================
# TrvicERP - AWS CloudFormation (Free Tier 最佳化)
# ============================================
# 月費估算: ~$15-25 USD (首年 Free Tier)
#
# 省錢策略:
#   ✓ 前端用 S3 + CloudFront (Free Tier: 1TB/月)
#   ✓ 移除 NAT Gateway (省 $32/月)
#   ✓ 移除 ElastiCache (省 $12/月，改用 in-memory)
#   ✓ ECS 放 public subnet (免 NAT)
#   ✓ Backend + AI 合併為單一 ECS Task
#   ✓ RDS db.t3.micro (Free Tier 750hr/月)
#   ✓ 關閉 Container Insights (省 CloudWatch 費)
#
# Usage:
#   aws cloudformation deploy \
#     --template-file aws/cloudformation.yml \
#     --stack-name trvicerp-production \
#     --parameter-overrides \
#       Environment=production \
#       DBPassword=your-secure-password \
#       JWTSecretKey=your-jwt-secret \
#     --capabilities CAPABILITY_NAMED_IAM
# ============================================

AWSTemplateFormatVersion: "2010-09-09"
Description: "TrvicERP - Free Tier Optimized (S3+CloudFront+ECS Fargate+RDS)"

# ─── Parameters ───
Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: "PostgreSQL master password"

  JWTSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: "JWT signing secret key"

  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Google Gemini API key for AI server"

  SupabaseUrl:
    Type: String
    Default: ""
    Description: "Supabase project URL"

  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Supabase anonymous key"

  BackendImage:
    Type: String
    Description: "ECR image URI for backend API"

  AIServerImage:
    Type: String
    Description: "ECR image URI for AI server"

# ─── Resources ───
Resources:

  # ══════════════════════════════════════════
  # FRONTEND: S3 + CloudFront (Free Tier)
  # ══════════════════════════════════════════

  # S3 Bucket for static frontend files
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "trvicerp-${Environment}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # OAC for CloudFront -> S3
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "trvicerp-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 Bucket Policy - CloudFront only
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # CloudFront Distribution
  # Free Tier: 1TB transfer out + 10M requests/month
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3

        Origins:
          # Origin 1: S3 (Frontend static files)
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""

          # Origin 2: ALB (Backend API)
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        CacheBehaviors:
          # /api/* -> Backend ALB
          - PathPattern: "/api/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]

          # /ai/* -> Backend ALB (AI Server)
          - PathPattern: "/ai/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]

        # SPA: all 404s return index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ══════════════════════════════════════════
  # NETWORKING: Simple VPC (No NAT Gateway!)
  # ══════════════════════════════════════════

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "trvicerp-${Environment}-vpc"

  # Public subnets only (ECS tasks get public IPs = no NAT needed)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "trvicerp-${Environment}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "trvicerp-${Environment}-public-2"

  # Private subnets for RDS only (no NAT needed for DB)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "trvicerp-${Environment}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "trvicerp-${Environment}-private-2"

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ══════════════════════════════════════════
  # SECURITY GROUPS
  # ══════════════════════════════════════════

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB - HTTP/HTTPS from CloudFront"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ECS Tasks - from ALB only"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 4001
          ToPort: 4001
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "RDS - from ECS only"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ══════════════════════════════════════════
  # DATABASE: RDS PostgreSQL (Free Tier)
  # Free Tier: 750hr db.t3.micro + 20GB
  # ══════════════════════════════════════════

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "TrvicERP DB subnet group"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "trvicerp-${Environment}"
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: "16.4"
      MasterUsername: trvicerp
      MasterUserPassword: !Ref DBPassword
      DBName: trvicerp
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      DBSubnetGroup: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ══════════════════════════════════════════
  # ECS CLUSTER (Fargate)
  # ══════════════════════════════════════════

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "trvicerp-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: disabled  # 省 CloudWatch 費用

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "trvicerp-${Environment}-ecs-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "trvicerp-${Environment}-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # Log Groups (7 天保留省空間)
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/trvicerp-${Environment}/backend"
      RetentionInDays: 7

  AIServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/trvicerp-${Environment}/ai-server"
      RetentionInDays: 7

  # ══════════════════════════════════════════
  # ECS TASK DEFINITIONS (最小規格)
  # ══════════════════════════════════════════

  # Backend API Task (最小 Fargate: 0.25 vCPU / 512MB)
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "trvicerp-${Environment}-backend"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            - Name: DATABASE_URL
              Value: !Sub "postgresql://trvicerp:${DBPassword}@${Database.Endpoint.Address}:5432/trvicerp"
            - Name: JWT_SECRET_KEY
              Value: !Ref JWTSecretKey
            - Name: JWT_ALGORITHM
              Value: HS256
            - Name: CORS_ORIGINS
              Value: "*"
            - Name: SERVER_HOST
              Value: "0.0.0.0"
            - Name: SERVER_PORT
              Value: "4000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  # AI Server Task (0.25 vCPU / 512MB, in-memory cache 取代 Redis)
  AIServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "trvicerp-${Environment}-ai-server"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: ai-server
          Image: !Ref AIServerImage
          Essential: true
          PortMappings:
            - ContainerPort: 4001
              Protocol: tcp
          Environment:
            - Name: LLM_PROVIDER
              Value: gemini
            - Name: GOOGLE_API_KEY
              Value: !Ref GeminiApiKey
            - Name: GEMINI_MODEL
              Value: gemini-2.5-flash
            - Name: REDIS_ENABLED
              Value: "false"
            - Name: QDRANT_ENABLED
              Value: "false"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AIServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai-server

  # ══════════════════════════════════════════
  # LOAD BALANCER (內部 ALB，僅 CloudFront 存取)
  # Free Tier: 首年 750hr ALB
  # ══════════════════════════════════════════

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "trvicerp-${Environment}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "trvicerp-${Environment}-be"
      Port: 4000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 60
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AIServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "trvicerp-${Environment}-ai"
      Port: 4001
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 60
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":"Not Found"}'
            StatusCode: "404"

  # /api/* -> Backend
  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ["/api/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # /ai/* -> AI Server
  AIServerListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: ["/ai/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AIServerTargetGroup

  # ══════════════════════════════════════════
  # ECS SERVICES (各 1 個實例，省錢)
  # ══════════════════════════════════════════

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: BackendListenerRule
    Properties:
      ServiceName: !Sub "trvicerp-${Environment}-backend"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # Public subnet, 免 NAT
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 4000
          TargetGroupArn: !Ref BackendTargetGroup

  AIServerService:
    Type: AWS::ECS::Service
    DependsOn: AIServerListenerRule
    Properties:
      ServiceName: !Sub "trvicerp-${Environment}-ai-server"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AIServerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # Public subnet, 免 NAT
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: ai-server
          ContainerPort: 4001
          TargetGroupArn: !Ref AIServerTargetGroup

# ─── Outputs ───
Outputs:
  CloudFrontURL:
    Description: "Frontend URL (CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID (for cache invalidation)"
    Value: !Ref CloudFrontDistribution

  FrontendBucketName:
    Description: "S3 Bucket for frontend deployment"
    Value: !Ref FrontendBucket

  ALBEndpoint:
    Description: "ALB DNS (Backend API)"
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  BackendURL:
    Description: "Backend API URL (via CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}/api"

  AIServerURL:
    Description: "AI Server URL (via CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}/ai"

  DatabaseEndpoint:
    Description: "RDS PostgreSQL endpoint"
    Value: !GetAtt Database.Endpoint.Address

  ECSClusterName:
    Description: "ECS Cluster name"
    Value: !Ref ECSCluster

  MonthlyCostEstimate:
    Description: "Estimated monthly cost (Free Tier year 1)"
    Value: "~$15-25 USD/month (RDS free, CloudFront free up to 1TB, ECS Fargate ~$15)"

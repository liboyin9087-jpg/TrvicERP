# TrvicERP Docker Compose
# 本地開發環境配置

version: '3.8'

services:
  # PostgreSQL Database (開發用)
  db:
    image: postgres:15-alpine
    container_name: trvicerp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trvicerp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (選用 - 用於快取和佇列)
  redis:
    image: redis:7-alpine
    container_name: trvicerp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trvicerp-backend
    ports:
      - "4000:4000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/trvicerp
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 4000 --reload

  # Frontend (開發模式)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trvicerp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000/ws
      - VITE_USE_MOCK=false
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:

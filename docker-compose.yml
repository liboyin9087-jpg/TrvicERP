version: '3.8'

services:
  # TrvicERP Frontend
  trvicerp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_LLM_PROVIDER=vercel-proxy
        - VITE_APP_URL=${VITE_APP_URL:-http://localhost:3000}
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NODE_ENV=production

  # Optional: Local Ollama for AI (if not using cloud LLM)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - local-ai
    # Run: docker compose --profile local-ai up
    # Then: docker exec -it trvicerp-ollama-1 ollama pull llama3.2:3b

volumes:
  ollama_data:

# Usage:
# 1. Copy .env.example to .env and fill in values
# 2. Build and start: docker compose up -d
# 3. Access at http://localhost:3000
#
# With local AI:
# docker compose --profile local-ai up -d
# docker exec -it trvicerp-ollama-1 ollama pull llama3.2:3b

# ============================================
# TrvicERP - Docker Compose (Local & AWS ECS)
# ============================================
# Usage:
#   Development: docker compose up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ============================================

version: "3.9"

services:
  # ─── Frontend (React + Nginx) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_AI_API_URL: ${VITE_AI_API_URL:-http://localhost:4001}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000/ws}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trvicerp-net
    restart: unless-stopped

  # ─── Backend API (FastAPI) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://trvicerp:trvicerp@postgres:5432/trvicerp}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4000
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trvicerp-net
    restart: unless-stopped

  # ─── AI Server (FastAPI + LLM) ───
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-3600}
      - QDRANT_ENABLED=true
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - BFL_API_KEY=${BFL_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trvicerp-net
    restart: unless-stopped

  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-trvicerp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trvicerp}
      - POSTGRES_DB=${POSTGRES_DB:-trvicerp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trvicerp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trvicerp-net
    restart: unless-stopped

  # ─── Redis (AI Caching) ───
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trvicerp-net
    restart: unless-stopped

  # ─── Qdrant (Vector Database for RAG) ───
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - trvicerp-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:

networks:
  trvicerp-net:
    driver: bridge
